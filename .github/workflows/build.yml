name: Build Tache Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Tache signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: .signing/tache.keystore
          key: tache-signing-key-v1

      - name: Create Tache signing key
        if: steps.signing-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .signing
          keytool -genkeypair -v \
            -keystore .signing/tache.keystore \
            -storepass Tache2026 \
            -keypass Tache2026 \
            -alias tache \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Tache, OU=Mobile, O=Manuel Botelho, L=Tours, ST=Centre-Val de Loire, C=FR"

      - name: Install Android platform
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKMANAGER --licenses >/dev/null || true
          $SDKMANAGER "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tache-Android-apk
          path: app/build/outputs/apk/debug/app-debug.apk
